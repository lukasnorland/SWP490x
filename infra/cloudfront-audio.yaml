AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFront in front of catalog audio and artwork on the MRS assets bucket.
  The bucket stays private. Only this distribution can read audio and artwork
  through OAC; catalog JSON is not exposed through the CDN.

Parameters:
  BucketName:
    Type: String
    Default: mrs-133857166188-assets
    AllowedPattern: "^[a-z0-9.-]{3,63}$"
    Description: Existing assets bucket (not created by this stack).

Resources:
  AudioOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3"
        Description: Sign CloudFront GETs to the MRS assets bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AudioDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: Project
          Value: mrs
        - Key: Purpose
          Value: catalog-audio
      DistributionConfig:
        Enabled: true
        Comment: MRS catalog audio CDN
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: MrsAssetsS3
            DomainName: !Sub "${BucketName}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !GetAtt AudioOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: MrsAssetsS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: false
          # CachingOptimizedForUncompressedObjects - MP3s should not be gzipped.
          CachePolicyId: b2884449-e4de-46a7-ac36-70bc7f1ddd6d
          # SimpleCORS for browser media requests.
          ResponseHeadersPolicyId: 60669652-455b-4ae9-85a4-c4c02393f86c

  AudioBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontCatalogMedia
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${BucketName}/song-data/audio/*"
              - !Sub "arn:${AWS::Partition}:s3:::${BucketName}/song-data/artwork/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${AudioDistribution}"

Outputs:
  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref AudioDistribution
  DomainName:
    Description: HTTPS host for catalog audioUrl values
    Value: !GetAtt AudioDistribution.DomainName
  AudioUrlPrefix:
    Description: Prefix to write into staged JSON audioUrl
    Value: !Sub "https://${AudioDistribution.DomainName}/song-data/audio/"
  ArtworkUrlPrefix:
    Description: Prefix to write into staged JSON coverUrl
    Value: !Sub "https://${AudioDistribution.DomainName}/song-data/artwork/"
