<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: shell(~{::content})}">
<!--/* P-02 Search & Recommendation — spec 4.3 (FT-03, FT-04, FT-05). */-->
<body>
<div th:fragment="content">

  <header class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-3 mb-xl">
    <div class="d-flex flex-column gap-1">
      <h1>Search the catalog</h1>
      <p class="small text-secondary">
        Describe the playlist you are curating for. Matches are ranked from the catalog.
      </p>
    </div>
  </header>

  <div class="d-flex flex-column gap-4">

    <!-- Outcome of the Add-to-playlist dialog and of Interpret, which both
         redirect back here (UC-03 / NFR-U01). -->
    <th:block th:if="${flash != null}">
      <div th:replace="~{fragments/components :: notice(${flashVariant},
          ${flashVariant == 'success'} ? 'circle-check'
            : (${flashVariant == 'info'} ? 'info' : 'alert-triangle'), ${flash})}"></div>
    </th:block>

    <section class="card">
      <div class="card-body">
        <form method="post" th:action="@{/search/interpret}" class="d-flex flex-column gap-3"
              data-search-prompt data-busy-label="Finding matches…">
          <label class="form-label mb-0" for="searchPrompt">Playlist need</label>
          <div class="search-prompt-field">
            <div class="input-group">
              <span class="input-group-text" title="Interpreted against catalog metadata">
                <svg th:replace="~{fragments/icons :: icon('sparkles', 'icon--sm')}"></svg>
              </span>
              <textarea class="form-control" id="searchPrompt" name="q" rows="2"
                        minlength="10" maxlength="200" required
                        placeholder="e.g. upbeat summer campaign for a beach game"
                        th:text="${promptQuery}"></textarea>
            </div>
          </div>
          <div class="search-interpreting-status" data-busy-status hidden role="status"
               aria-live="polite">
            <span class="search-interpreting-status__icon" aria-hidden="true">
              <svg th:replace="~{fragments/icons :: icon('sparkles', 'icon--sm')}"></svg>
            </span>
            <div class="search-interpreting-status__copy">
              <p class="mb-1 fw-medium">Putting your playlist together</p>
              <p class="small text-secondary mb-0">
                Matching moods and tags against the catalog. This can take up to 30 seconds —
                please stay on this page.
              </p>
            </div>
          </div>
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 search-prompt-controls">
            <p class="small text-secondary mb-0">
              <span data-search-count>0</span>/200 · 10–200 characters
            </p>
            <div class="d-flex align-items-end gap-2">
              <div>
                <label class="form-label mb-1" for="searchTopN">Top-N</label>
                <input class="form-control" type="number" id="searchTopN" name="topN"
                       min="1" step="1" inputmode="numeric" placeholder="All matches"
                       style="width: 7rem"
                       th:value="${filterTopN}" title="Keep only the N best-ranked matches">
              </div>
              <button type="submit" class="btn btn-primary" data-search-submit>Interpret</button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <div th:replace="~{fragments/search-results :: results}"></div>

  </div>

  <!-- th:block, because th:replace outranks th:if on the same element. -->
  <th:block th:if="${currentUser != null and currentUser.curator}">
    <div th:replace="~{fragments/add-to-playlist :: dialog}"></div>
  </th:block>

</div>
</body>
</html>
