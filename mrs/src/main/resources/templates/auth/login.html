<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: auth(~{::content})}">
<!--/*
  P-00 Login — spec 4.1.

  Zones: A heading, D banner slot, B credentials, C sign-in + reset link.
  The banner is chosen by the query parameter the security handlers redirect
  with, which covers the invalid-credentials, locked, and session-expired
  states. "Submitting" is applied client-side by mrs.js.
*/-->
<body>
<div th:fragment="content">

  <div class="card">
    <div class="card-body d-flex flex-column gap-4">

      <!-- Zone A -->
      <div class="d-flex flex-column gap-2">
        <h1 class="h2">Sign in to MRS</h1>
        <p class="small text-secondary">
          Internal accounts only — contact your ADMIN for access.
        </p>
      </div>

      <!-- Zone D: banner slot. Wrong credentials never disclose whether the
           email exists. -->
      <th:block th:if="${param.error != null}">
        <div th:replace="~{fragments/components :: notice('danger', 'alert-triangle', 'Email or password is incorrect')}"></div>
      </th:block>
      <th:block th:if="${param.locked != null}">
        <div th:replace="~{fragments/components :: notice('danger', 'lock', 'Too many attempts — try again in 15 minutes')}"></div>
      </th:block>
      <th:block th:if="${param.expired != null}">
        <div th:replace="~{fragments/components :: notice('info', 'info', 'Your session expired after 8 hours of inactivity. Sign in again to continue.')}"></div>
      </th:block>
      <th:block th:if="${param.logout != null}">
        <div th:replace="~{fragments/components :: notice('info', 'info', 'You have been signed out.')}"></div>
      </th:block>
      <th:block th:if="${param.reset != null}">
        <div th:replace="~{fragments/components :: notice('success', 'circle-check', 'Password updated. Sign in with your new password.')}"></div>
      </th:block>

      <!-- Zones B and C -->
      <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3"
            data-busy-label="Signing in…">
        <div>
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="username"
                 required autofocus th:disabled="${param.locked != null}">
        </div>

        <div>
          <label class="form-label" for="password">Password</label>
          <div class="input-group">
            <input class="form-control" type="password" id="password" name="password"
                   autocomplete="current-password" required th:disabled="${param.locked != null}">
            <button type="button" class="btn btn-outline-secondary" data-password-toggle="password"
                    aria-pressed="false" title="Show password">
              <span class="visually-hidden">Show password</span>
              <span data-when="hidden">
                <svg th:replace="~{fragments/icons :: icon('eye', 'icon--sm')}"></svg>
              </span>
              <span data-when="visible" hidden>
                <svg th:replace="~{fragments/icons :: icon('eye-off', 'icon--sm')}"></svg>
              </span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100"
                th:disabled="${param.locked != null}">Sign in</button>
      </form>

      <p class="small text-center">
        <a th:href="@{/password-reset}">Forgot password?</a>
      </p>

    </div>
  </div>

</div>
</body>
</html>
