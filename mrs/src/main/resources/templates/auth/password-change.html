<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: auth(~{::content})}">
<!--/*
  Forced password change on first login (FT-09, flow F-04).
  Uses the unauthenticated layout deliberately: until the password is set the
  account has no access to the shell, so no navigation is offered.
*/-->
<body>
<div th:fragment="content">

  <div class="card">
    <div class="card-body d-flex flex-column gap-4">

      <div class="d-flex flex-column gap-2">
        <h1 class="h2">Choose your own password</h1>
        <p class="small text-secondary">
          Your account was created with a password set by an ADMIN. Choose your own to continue.
        </p>
      </div>

      <th:block th:if="${violations}">
        <div th:replace="~{fragments/components :: violations(${violations})}"></div>
      </th:block>

      <form th:action="@{/account/password}" method="post" class="d-flex flex-column gap-4"
            data-busy-label="Saving…">

        <div>
          <label class="form-label" for="currentPassword">Current password</label>
          <input class="form-control" type="password" id="currentPassword" name="currentPassword"
                 autocomplete="current-password" required autofocus>
        </div>

        <div>
          <label class="form-label" for="password">New password</label>
          <div class="input-group">
            <input class="form-control" type="password" id="password" name="password"
                   autocomplete="new-password" required>
            <button type="button" class="btn btn-outline-secondary" data-password-toggle="password"
                    aria-pressed="false" title="Show password">
              <span class="visually-hidden">Show password</span>
              <span data-when="hidden">
                <svg th:replace="~{fragments/icons :: icon('eye', 'icon--sm')}"></svg>
              </span>
              <span data-when="visible" hidden>
                <svg th:replace="~{fragments/icons :: icon('eye-off', 'icon--sm')}"></svg>
              </span>
            </button>
          </div>
        </div>

        <div>
          <label class="form-label" for="confirmPassword">Confirm new password</label>
          <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
                 autocomplete="new-password" required>
        </div>

        <div th:replace="~{fragments/components :: passwordChecklist('password')}"></div>

        <button type="submit" class="btn btn-primary btn-lg w-100">Save password</button>
      </form>

      <form th:action="@{/logout}" method="post" class="text-center">
        <button type="submit" class="btn btn-ghost btn-sm">Sign out instead</button>
      </form>

    </div>
  </div>

</div>
</body>
</html>
