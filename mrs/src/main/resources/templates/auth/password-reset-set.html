<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: auth(~{::content})}">
<!--/*
  P-01 Password Reset, step 2 — spec 4.2.
  A link older than 30 minutes shows the expired card; a password that fails
  BR-12 is rejected while the link stays usable for its remaining window.
*/-->
<body>
<div th:fragment="content" th:attr="data-auth-api=${apiAuthBase}">

  <div class="card">
    <div class="card-body d-flex flex-column gap-4">

      <div th:if="${expired}" class="d-flex flex-column gap-4">
        <h1 class="h2">This link has expired</h1>
        <p class="small text-secondary">
          Reset links are valid for 30 minutes. Request a new one to continue.
        </p>
        <a class="btn btn-primary btn-lg w-100" th:href="@{/password-reset}">Request a new link</a>
        <p class="small text-center">
          <a th:href="@{/login}">Back to sign in</a>
        </p>
      </div>

      <div th:unless="${expired}" class="d-flex flex-column gap-4">
        <div class="d-flex flex-column gap-2">
          <p class="label text-secondary">Step 2 of 2</p>
          <h1 class="h2">Choose a new password</h1>
        </div>

        <div id="passwordResetSetErrors" hidden></div>

        <form id="passwordResetSetForm" class="d-flex flex-column gap-4"
              data-busy-label="Saving…">
          <input type="hidden" id="resetToken" name="token" th:value="${token}">

          <div>
            <label class="form-label" for="password">New password</label>
            <div class="input-group">
              <input class="form-control" type="password" id="password" name="password"
                     autocomplete="new-password" required autofocus>
              <button type="button" class="btn btn-outline-secondary" data-password-toggle="password"
                      aria-pressed="false" title="Show password">
                <span class="visually-hidden">Show password</span>
                <span data-when="hidden">
                  <svg th:replace="~{fragments/icons :: icon('eye', 'icon--sm')}"></svg>
                </span>
                <span data-when="visible" hidden>
                  <svg th:replace="~{fragments/icons :: icon('eye-off', 'icon--sm')}"></svg>
                </span>
              </button>
            </div>
          </div>

          <div>
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-control" type="password" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" required>
          </div>

          <div th:replace="~{fragments/components :: passwordChecklist('password')}"></div>

          <button type="submit" class="btn btn-primary btn-lg w-100">Save new password</button>
        </form>

        <p class="small text-center">
          <a th:href="@{/login}">Back to sign in</a>
        </p>
      </div>

    </div>
  </div>

</div>
</body>
</html>
