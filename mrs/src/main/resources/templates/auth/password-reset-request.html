<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: auth(~{::content})}">
<!--/*
  P-01 Password Reset, step 1 — spec 4.2.
  Both outcomes render the same confirmation, so the screen cannot be used to
  discover which addresses are registered.
*/-->
<body>
<div th:fragment="content">

  <div class="card">
    <div class="card-body d-flex flex-column gap-4">

      <!-- Zone A -->
      <div class="d-flex flex-column gap-2">
        <p class="label text-secondary">Step 1 of 2</p>
        <h1 class="h2">Reset your password</h1>
      </div>

      <!-- Sent state -->
      <div th:if="${sent}" class="d-flex flex-column gap-4">
        <div th:replace="~{fragments/components :: notice('info', 'info',
            |If that address belongs to an MRS account, a reset link is on its way. The link is valid for ${resetValidityMinutes} minutes.|)}"></div>
        <a class="btn btn-secondary btn-lg w-100" th:href="@{/login}">Back to sign in</a>
      </div>

      <!-- Request state -->
      <div th:unless="${sent}" class="d-flex flex-column gap-4">
        <p class="small text-secondary">
          Enter your internal email address and we will send you a link to choose a new password.
        </p>

        <form th:action="@{/password-reset}" method="post" class="d-flex flex-column gap-3"
              data-busy-label="Sending…">
          <div>
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email"
                   autocomplete="username" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">Send reset link</button>
        </form>

        <p class="small text-center">
          <a th:href="@{/login}">Back to sign in</a>
        </p>
      </div>

    </div>
  </div>

</div>
</body>
</html>
