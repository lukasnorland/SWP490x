<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="message(content)">
<!--/* Shared email wrapper with inline colors/styles for mail-client compatibility.
  Usage: email/layout :: message(~{::content}) */-->
<head>
  <meta charset="UTF-8">
</head>

<body style="margin:0; padding:24px 12px; background-color:#f1f5f9;
             font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#0f172a;">

<div style="max-width:560px; margin:0 auto; background-color:#ffffff;
            border:1px solid #e2e8f0; border-radius:12px; overflow:hidden;">

  <div style="padding:20px 32px; background-color:#312e81; color:#ffffff;
              font-size:18px; font-weight:600; letter-spacing:0.02em;">
    MRS
  </div>

  <div style="padding:32px; font-size:15px; line-height:1.6;" th:insert="${content}">
    <!-- message body -->
  </div>

  <div style="padding:20px 32px; border-top:1px solid #e2e8f0;
              font-size:12px; line-height:1.5; color:#64748b;">
    This is an automated message from the Music Recommendation System.
    Please do not reply to it.
  </div>
</div>

</body>
</html>
