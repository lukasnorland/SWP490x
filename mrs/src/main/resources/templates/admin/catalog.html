<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: shell(~{::content})}">
<!--/* P-06b Admin — Song Catalog & Metadata — spec 4.10 (FT-09, FT-03). */-->
<body>
<div th:fragment="content">

  <header class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-3 mb-xl">
    <div class="d-flex flex-column gap-1">
      <h1>Song Catalog &amp; Metadata</h1>
      <p class="small text-secondary">
        The catalog behind every search. Untagged songs stay out of filtered results (DC-03).
      </p>
    </div>
    <!-- Zone A: songs arrive through the import, so that is the primary action. -->
    <a class="btn btn-primary" th:href="@{/admin/import}">
      <svg th:replace="~{fragments/icons :: icon('upload', 'icon--sm')}"></svg>
      <span>Catalog Import</span>
    </a>
  </header>

  <div class="d-flex flex-column gap-4">

    <section class="d-flex flex-wrap gap-4 small text-secondary">
      <span>
        <span class="table__numeric fw-semibold text-body" th:text="${totalSongs}">0</span>
        songs
      </span>
      <span th:if="${untaggedCount > 0}" class="text-warning-emphasis">
        <svg th:replace="~{fragments/icons :: icon('alert-triangle', 'icon--sm')}"></svg>
        <span class="table__numeric fw-semibold" th:text="${untaggedCount}">0</span>
        untagged, so not reachable by a filtered search (DC-03)
      </span>
    </section>

    <section th:replace="~{fragments/song-catalog :: filters}"></section>

    <div th:replace="~{fragments/song-catalog :: results}"></div>

    <section th:replace="~{fragments/components :: zonePlaceholder('Zone C — Tags',
        'Tag dictionary',
        'Per-category tag lists (Genre, Mood, Artist, Tags) with add, rename and delete. Deleting warns when the tag is still attached to songs.')}"></section>

    <section th:replace="~{fragments/components :: zonePlaceholder('Zone A — editing',
        'New song and per-row edit (UC-29)',
        'The edit modal submits the loaded version; a stale save returns HTTP 409 with refresh only — songs have no clone option (BR-06, DC-02).')}"></section>
  </div>

</div>
</body>
</html>
