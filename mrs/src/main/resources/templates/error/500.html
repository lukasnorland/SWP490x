<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: auth(~{::content})}">
<body>
<div th:fragment="content">
  <div class="card">
    <div class="card-body d-flex flex-column gap-4">
      <h1 class="h2">An unexpected error occurred. Please contact your administrator.</h1>
      <p class="small text-secondary" th:if="${correlationId != null}">
        Reference: <span th:text="${correlationId}">—</span>
      </p>
      <a class="btn btn-primary btn-lg w-100" th:href="@{/}">Back to my workspace</a>
    </div>
  </div>
</div>
</body>
</html>
