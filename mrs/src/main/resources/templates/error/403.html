<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: auth(~{::content})}">
<!--/*
  Generic forbidden page. Deliberately says nothing about what was requested:
  a Customer following a link outside their granted scope must not be able to
  infer that the playlist exists (SC-06 exception, spec 4.7).
*/-->
<body>
<div th:fragment="content">
  <div class="card">
    <div class="card-body d-flex flex-column gap-4">
      <h1 class="h2">This page is not available</h1>
      <p class="small text-secondary">
        You do not have access to this page, or it does not exist.
      </p>
      <a class="btn btn-primary btn-lg w-100" th:href="@{/}">Back to my workspace</a>
    </div>
  </div>
</div>
</body>
</html>
