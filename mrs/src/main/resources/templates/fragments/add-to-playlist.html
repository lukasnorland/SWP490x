<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  Add-to-playlist dialog, opened by the + button in the Songs table (FT-06).

  Included by the page rather than by the results fragment: catalog.js replaces
  #catalog-results on every filter and pager step, and a modal inside it would
  be torn down while the user was still in it.

  Model:
    myPlaylists — editable Drafts the song may be added to (PlaylistOption)
*/-->
<body>

<div th:fragment="dialog" class="modal fade" id="addToPlaylist" tabindex="-1"
     aria-labelledby="addToPlaylistTitle" aria-hidden="true" data-add-to-playlist-dialog>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <div class="d-flex flex-column gap-1">
          <h2 class="modal-title h4" id="addToPlaylistTitle" data-add-title>Add to playlist</h2>
          <p class="small text-secondary mb-0" data-add-song-label>Choose a playlist.</p>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body d-flex flex-column gap-4">

        <!--/* Two modes, one dialog. Each mode sits in a plain wrapper that the
               script toggles with [hidden]: the forms inside carry .d-flex, and
               Bootstrap's display utilities out-rank its [hidden] reset, so a
               hidden flex form would stay visible. */-->
        <div class="mode-stack" data-add-song-mode>

        <!--/* Existing Drafts. Published playlists are locked (DC-08), so they
               are never offered here. */-->
        <form th:action="@{/playlists/0/songs}" method="post"
              class="d-flex flex-column gap-2 mb-0"
              data-add-existing-form
              th:if="${myPlaylists != null and !myPlaylists.isEmpty()}">
          <input type="hidden" name="returnTo" data-add-return-to value="">
          <!--/* BR-06: the version of whichever Draft is picked. The dialog
                 sits outside #catalog-results so it survives filter and pager
                 steps, which also means this value is as old as the page: a
                 playlist edited elsewhere meanwhile lands on the conflict
                 screen rather than being overwritten. */-->
          <input type="hidden" name="expectedVersion" data-add-playlist-version value="0">
          <div data-add-song-ids>
            <input type="hidden" name="songId" data-add-song-id value="">
          </div>

          <label class="form-label" for="addToPlaylistPick">Existing playlist</label>
          <div class="d-flex gap-2">
            <select class="form-select" id="addToPlaylistPick" name="playlistId"
                    data-add-playlist-select>
              <option th:each="option : ${myPlaylists}"
                      th:value="${option.id}"
                      th:data-version="${option.version}"
                      th:text="|${option.name} (${option.songCount} songs)|">Playlist</option>
            </select>
            <button type="submit" class="btn btn-primary flex-shrink-0">Add</button>
          </div>
        </form>

        <p class="small text-secondary mb-0"
           th:if="${myPlaylists == null or myPlaylists.isEmpty()}">
          You have no draft playlists yet. Name one below and the song goes straight into it.
        </p>

        <hr class="my-0" th:if="${myPlaylists != null and !myPlaylists.isEmpty()}">

        <!--/* Create-and-add, so the whole loop is one action (NFR-U01). */-->
        <form th:action="@{/playlists}" method="post"
              class="d-flex flex-column gap-2 mb-0" data-add-create-form>
          <input type="hidden" name="returnTo" data-add-return-to value="">
          <div data-add-song-ids>
            <input type="hidden" name="songId" data-add-song-id value="">
          </div>

          <label class="form-label" for="addToPlaylistName">New playlist</label>
          <div class="d-flex gap-2">
            <input class="form-control" type="text" id="addToPlaylistName" name="name"
                   maxlength="200" required placeholder="Playlist name">
            <button type="submit" class="btn btn-ghost flex-shrink-0">Create and add</button>
          </div>
        </form>

        </div>

        <!--/* "Create playlist from results": the current Search filters ride
               along as hidden fields (filled from the page URL at open time), so
               the server re-runs the search and adds every match, all pages. */-->
        <div class="mode-stack" data-create-from-results-mode hidden>
        <form th:action="@{/search/create-playlist}" method="post"
              class="d-flex flex-column gap-2 mb-0" data-create-from-results-form>
          <input type="hidden" name="returnTo" data-add-return-to value="">
          <div data-create-from-results-criteria></div>

          <label class="form-label" for="createFromResultsName">New playlist</label>
          <div class="d-flex gap-2">
            <input class="form-control" type="text" id="createFromResultsName" name="name"
                   maxlength="200" placeholder="Playlist name">
            <button type="submit" class="btn btn-primary flex-shrink-0">Create</button>
          </div>
        </form>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
