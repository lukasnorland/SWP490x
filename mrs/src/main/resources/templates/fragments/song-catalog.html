<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  Shared song list UI for P-06b (/admin/catalog) and authenticated browse (/songs).

  Model:
    catalogBasePath  — form / pager / clear target
    browseMode       — true hides admin ops filters and upload-oriented empty copy
*/-->
<body>

<!-- Zone B: filters — partial fetch keeps the shell player mounted. -->
<section th:fragment="filters" class="card">
  <div class="card-body">
    <form class="row g-3 align-items-end" method="get" th:action="@{${catalogBasePath}}"
          data-catalog-filters>
      <div class="col-12 col-md-3">
        <label class="form-label" for="filterProvider">Provider</label>
        <select class="form-select" id="filterProvider" name="provider">
          <option value="">All</option>
          <option th:each="provider : ${providers}"
                  th:value="${provider}"
                  th:text="${provider}"
                  th:selected="${provider == filterProvider}">Provider</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label" for="filterGenre">Genre</label>
        <select class="form-select" id="filterGenre" name="genreId">
          <option value="">All</option>
          <option th:each="tag : ${tags}"
                  th:if="${tag.type.name() == 'GENRE'}"
                  th:value="${tag.id}"
                  th:text="${tag.name}"
                  th:selected="${filterGenreId != null and tag.id == filterGenreId}">Genre</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label" for="filterMood">Mood</label>
        <select class="form-select" id="filterMood" name="moodId">
          <option value="">All</option>
          <option th:each="tag : ${tags}"
                  th:if="${tag.type.name() == 'MOOD'}"
                  th:value="${tag.id}"
                  th:text="${tag.name}"
                  th:selected="${filterMoodId != null and tag.id == filterMoodId}">Mood</option>
        </select>
      </div>
      <div class="col-12 col-md-3">
        <label class="form-label" for="filterTag">Tags</label>
        <select class="form-select" id="filterTag" name="tagId">
          <option value="">All</option>
          <option th:each="tag : ${tags}"
                  th:if="${tag.type.name() == 'TAGS'}"
                  th:value="${tag.id}"
                  th:text="${tag.name}"
                  th:selected="${filterTagId != null and tag.id == filterTagId}">Tag</option>
        </select>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="filterQuery">Search</label>
        <input class="form-control" type="search" id="filterQuery" name="q"
               placeholder="Title or artist"
               th:value="${filterQuery}">
      </div>
      <div class="col-12 col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-grow-1">Filter</button>
        <a class="btn btn-ghost" th:href="@{${catalogBasePath}}" data-catalog-clear
           title="Clear filters">Clear</a>
      </div>
    </form>
  </div>
</section>

<!-- Zone C + D: swapped in-place by catalog.js on pager / filter (player stays mounted). -->
<div id="catalog-results" th:fragment="results" data-catalog-results>

  <section class="card">
    <div class="catalog-table-wrap">
      <table class="table catalog-table align-middle mb-0">
        <colgroup>
          <col class="catalog-col-title">
          <col class="catalog-col-artist">
          <col class="catalog-col-source">
          <col class="catalog-col-genre">
          <col class="catalog-col-mood">
          <col class="catalog-col-tags">
          <col class="catalog-col-length">
          <col class="catalog-col-bpm">
        </colgroup>
        <thead>
          <tr>
            <th scope="col">Title</th>
            <th scope="col">Artist</th>
            <th scope="col">Source</th>
            <th scope="col">Genre</th>
            <th scope="col">Mood</th>
            <th scope="col">Tags</th>
            <th scope="col">Length</th>
            <th scope="col">BPM</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="song : ${songs}">
            <td>
              <div class="d-flex align-items-center gap-3">
                <img class="song-cover" th:if="${song.coverUrl != null}"
                     th:src="${song.coverUrl}" th:alt="|Cover of ${song.title}|"
                     loading="lazy" width="40" height="40">
                <span class="song-cover song-cover--empty" th:if="${song.coverUrl == null}"
                      aria-hidden="true">
                  <svg th:replace="~{fragments/icons :: icon('music', 'icon--sm')}"></svg>
                </span>
                <div class="d-flex flex-column flex-grow-1 min-w-0">
                  <button type="button"
                          class="song-title-play"
                          th:if="${song.audioUrl != null and !#strings.isEmpty(song.audioUrl)}"
                          th:text="${song.title}"
                          th:data-preview-url="${song.audioUrl}"
                          th:data-preview-title="${song.title}"
                          th:data-preview-artist="${song.artist}"
                          th:data-preview-cover="${song.coverUrl}"
                          th:data-preview-ambience-a="${song.ambienceA}"
                          th:data-preview-ambience-b="${song.ambienceB}"
                          th:data-preview-duration="${song.duration}"
                          th:aria-label="|Play ${song.title}|">Title</button>
                  <span th:if="${song.audioUrl == null or #strings.isEmpty(song.audioUrl)}"
                        th:text="${song.title}">Title</span>
                  <!-- DC-03: a song with no tag cannot be found by a filter. -->
                  <span th:if="${song.tags.isEmpty()}"
                        class="small text-warning-emphasis d-inline-flex align-items-center gap-1">
                    <svg th:replace="~{fragments/icons :: icon('alert-triangle', 'icon--sm')}"></svg>
                    Untagged
                  </span>
                </div>
                <div th:if="${!browseMode}"
                     class="catalog-row-ops d-inline-flex align-items-center flex-shrink-0 gap-1">
                  <button type="button" class="btn btn-icon"
                          title="Edit song"
                          data-bs-toggle="modal"
                          data-bs-target="#editSong"
                          data-edit-song
                          th:data-song-id="${song.id}"
                          th:data-song-version="${song.version}"
                          th:data-song-title="${song.title}"
                          th:data-song-artist="${song.artist}"
                          th:data-song-duration="${song.duration}"
                          th:data-song-bpm="${song.bpm}"
                          th:data-song-isrc="${song.isrc}"
                          th:data-song-explicit="${song.explicit == true}"
                          th:data-song-genres="${song.genreNames}"
                          th:data-song-moods="${song.moodNames}"
                          th:data-song-tags="${song.freeformTagNames}"
                          th:data-song-provider="${song.sourceProvider}"
                          th:data-song-external-id="${song.externalSourceId}"
                          th:data-song-audio-url="${song.audioUrl}"
                          th:data-song-cover-url="${song.coverUrl}">
                    <svg th:replace="~{fragments/icons :: icon('pencil', 'icon--sm')}"></svg>
                    <span class="visually-hidden">Edit</span>
                  </button>
                  <form th:action="@{|/admin/catalog/${song.id}/delete|}" method="post">
                    <button type="submit" class="btn btn-icon"
                            title="Delete song"
                            onclick="return confirm('Remove this song from the catalog? Playlists that include it will lose the track.');">
                      <svg th:replace="~{fragments/icons :: icon('trash-2', 'icon--sm')}"></svg>
                      <span class="visually-hidden">Delete</span>
                    </button>
                  </form>
                </div>
              </div>
            </td>
            <td th:text="${song.artist != null} ? ${song.artist} : '—'">Artist</td>
            <td class="small">
              <div class="d-flex flex-column min-w-0">
                <span th:text="${song.sourceProvider}">Provider</span>
                <span class="catalog-source-id font-monospace text-secondary"
                      th:text="${song.externalSourceId}">id</span>
              </div>
            </td>
            <td>
              <div class="catalog-tag-list d-flex flex-wrap gap-1" th:if="${!song.genreTags.isEmpty()}">
                <span th:each="tag : ${song.genreTags}"
                      class="badge bg-secondary-subtle text-secondary-emphasis"
                      th:text="${tag.name}">genre</span>
              </div>
              <span th:if="${song.genreTags.isEmpty()}" class="text-secondary">—</span>
            </td>
            <td>
              <div class="catalog-tag-list d-flex flex-wrap gap-1" th:if="${!song.moodTags.isEmpty()}">
                <span th:each="tag : ${song.moodTags}"
                      class="badge bg-secondary-subtle text-secondary-emphasis"
                      th:text="${tag.name}">mood</span>
              </div>
              <span th:if="${song.moodTags.isEmpty()}" class="text-secondary">—</span>
            </td>
            <td>
              <div class="catalog-tag-list d-flex flex-wrap gap-1" th:if="${!song.freeformTags.isEmpty()}">
                <span th:each="tag : ${song.freeformTags}"
                      class="badge bg-secondary-subtle text-secondary-emphasis"
                      th:text="${tag.name}">tag</span>
              </div>
              <span th:if="${song.freeformTags.isEmpty()}" class="text-secondary">—</span>
            </td>
            <td class="table__numeric"
                th:text="${song.duration != null}
                         ? ${#numbers.formatInteger(song.duration / 60, 1)} + ':'
                           + ${#numbers.formatInteger(song.duration % 60, 2)}
                         : '—'">0:00</td>
            <td class="table__numeric" th:text="${song.bpm != null} ? ${song.bpm} : '—'">—</td>
          </tr>
          <tr th:if="${songs == null or songs.isEmpty()}">
            <td colspan="8">
              <!-- One element, because th:replace outranks th:if: two guarded
                   divs would both be swapped in and both copies would show. -->
              <div th:replace="~{fragments/components :: emptyState('music', 'No songs match',
                      ${browseMode}
                        ? 'Try clearing the filters above.'
                        : 'Use Add Song to upload one, or clear the filters above.')}"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Zone D: pagination (20 / page) -->
  <nav th:replace="~{fragments/components :: catalogPager(${songs}, ${catalogBasePath})}"></nav>

</div>

</body>
</html>
