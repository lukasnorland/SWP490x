<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  Rename-playlist dialog. Opened by a [data-rename-playlist] pencil; JS fills
  the current name and points the form at /playlists/{id}/rename.
*/-->
<body>

<div th:fragment="dialog" class="modal fade" id="renamePlaylist" tabindex="-1"
     aria-labelledby="renamePlaylistTitle" aria-hidden="true"
     data-rename-playlist-dialog>
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" th:action="@{/playlists/0/rename}" method="post"
          data-rename-form>
      <input type="hidden" name="returnTo" data-rename-return-to value="">
      <div class="modal-header">
        <h2 class="modal-title h4" id="renamePlaylistTitle">Rename playlist</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body d-flex flex-column gap-2">
        <label class="form-label" for="renamePlaylistName">Name</label>
        <input class="form-control" type="text" id="renamePlaylistName" name="name"
               data-rename-name maxlength="200" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>
