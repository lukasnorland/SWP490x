<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/*
  Icon set for spec 1.5 — Lucide geometry, 24x24 viewBox, 2px stroke, served
  locally so the app has no external icon dependency.

  Stroke colour, width and size come from the .icon class on the consuming
  <svg>, so symbols carry geometry only.

  Usage:  <svg th:replace="~{fragments/icons :: icon('search', '')}"></svg>
          <svg th:replace="~{fragments/icons :: icon('trash-2', 'icon--sm')}"></svg>
*/-->
<body>

<svg th:fragment="sprite" xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true" focusable="false">

  <!-- Navigation (4.0) -->
  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.3-4.3"></path>
  </symbol>
  <symbol id="i-list-music" viewBox="0 0 24 24">
    <path d="M21 15V6"></path>
    <path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z"></path>
    <path d="M12 12H3"></path>
    <path d="M16 6H3"></path>
    <path d="M12 18H3"></path>
  </symbol>
  <symbol id="i-users" viewBox="0 0 24 24">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
    <circle cx="9" cy="7" r="4"></circle>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
  </symbol>
  <symbol id="i-music" viewBox="0 0 24 24">
    <path d="M9 18V5l12-2v13"></path>
    <circle cx="6" cy="18" r="3"></circle>
    <circle cx="18" cy="16" r="3"></circle>
  </symbol>
  <symbol id="i-settings" viewBox="0 0 24 24">
    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </symbol>
  <symbol id="i-scroll-text" viewBox="0 0 24 24">
    <path d="M15 12h-5"></path>
    <path d="M15 8h-5"></path>
    <path d="M19 17V5a2 2 0 0 0-2-2H4"></path>
    <path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"></path>
  </symbol>
  <symbol id="i-user" viewBox="0 0 24 24">
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
    <circle cx="12" cy="7" r="4"></circle>
  </symbol>
  <symbol id="i-log-out" viewBox="0 0 24 24">
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
    <path d="m16 17 5-5-5-5"></path>
    <path d="M21 12H9"></path>
  </symbol>
  <symbol id="i-menu" viewBox="0 0 24 24">
    <path d="M4 6h16"></path>
    <path d="M4 12h16"></path>
    <path d="M4 18h16"></path>
  </symbol>

  <!-- Actions (1.5 icon contract) -->
  <symbol id="i-x" viewBox="0 0 24 24">
    <path d="M18 6 6 18"></path>
    <path d="m6 6 12 12"></path>
  </symbol>
  <symbol id="i-trash-2" viewBox="0 0 24 24">
    <path d="M3 6h18"></path>
    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    <path d="M10 11v6"></path>
    <path d="M14 11v6"></path>
  </symbol>
  <symbol id="i-circle-minus" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M8 12h8"></path>
  </symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24">
    <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path>
    <path d="m15 5 4 4"></path>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M5 12h14"></path>
    <path d="M12 5v14"></path>
  </symbol>
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
  </symbol>
  <symbol id="i-image" viewBox="0 0 24 24">
    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
    <circle cx="9" cy="9" r="2"></circle>
    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
  </symbol>
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <path d="m17 8-5-5-5 5"></path>
    <path d="M12 3v12"></path>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
    <path d="m7 10 5 5 5-5"></path>
    <path d="M12 15V3"></path>
  </symbol>
  <symbol id="i-lock" viewBox="0 0 24 24">
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
  </symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24">
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
  </symbol>
  <symbol id="i-sparkles" viewBox="0 0 24 24">
    <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path>
    <path d="M20 3v4"></path>
    <path d="M22 5h-4"></path>
  </symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
    <path d="M21 3v5h-5"></path>
    <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
    <path d="M8 16H3v5"></path>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24">
    <path d="M6 3l14 9-14 9z"></path>
  </symbol>
  <symbol id="i-pause" viewBox="0 0 24 24">
    <rect x="14" y="4" width="4" height="16" rx="1"></rect>
    <rect x="6" y="4" width="4" height="16" rx="1"></rect>
  </symbol>
  <symbol id="i-grip-vertical" viewBox="0 0 24 24">
    <circle cx="9" cy="6" r="1"></circle>
    <circle cx="9" cy="12" r="1"></circle>
    <circle cx="9" cy="18" r="1"></circle>
    <circle cx="15" cy="6" r="1"></circle>
    <circle cx="15" cy="12" r="1"></circle>
    <circle cx="15" cy="18" r="1"></circle>
  </symbol>

  <!-- Feedback -->
  <symbol id="i-alert-triangle" viewBox="0 0 24 24">
    <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path>
    <path d="M12 9v4"></path>
    <path d="M12 17h.01"></path>
  </symbol>
  <symbol id="i-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M12 16v-4"></path>
    <path d="M12 8h.01"></path>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M20 6 9 17l-5-5"></path>
  </symbol>
  <symbol id="i-circle-check" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"></circle>
    <path d="m9 12 2 2 4-4"></path>
  </symbol>
  <symbol id="i-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10"></circle>
  </symbol>

  <!-- Directional -->
  <symbol id="i-chevron-right" viewBox="0 0 24 24">
    <path d="m9 18 6-6-6-6"></path>
  </symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24">
    <path d="m6 9 6 6 6-6"></path>
  </symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24">
    <path d="m12 19-7-7 7-7"></path>
    <path d="M19 12H5"></path>
  </symbol>

  <!-- Password visibility -->
  <symbol id="i-eye" viewBox="0 0 24 24">
    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
    <circle cx="12" cy="12" r="3"></circle>
  </symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24">
    <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"></path>
    <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
    <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"></path>
    <path d="m2 2 20 20"></path>
  </symbol>

</svg>

<svg th:fragment="icon(name, cls)" class="icon" th:classappend="${cls}" aria-hidden="true" focusable="false">
  <use th:attr="href='#i-' + ${name}"></use>
</svg>

</body>
</html>
