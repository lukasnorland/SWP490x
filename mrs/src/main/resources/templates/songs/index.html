<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: shell(~{::content})}">
<!--/* Authenticated song browse — reuse of the P-06b catalog list for listen/preview. */-->
<body>
<div th:fragment="content">

  <header class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-3 mb-xl">
    <div class="d-flex flex-column gap-1">
      <h1>Songs</h1>
      <p class="small text-secondary">
        Browse the internal catalogue and preview tracks. Click a title to listen.
      </p>
    </div>
  </header>

  <div class="d-flex flex-column gap-4">

    <!-- Outcome of the Add-to-playlist dialog and of Interpret, which both
         redirect back here (UC-03 / NFR-U01). -->
    <th:block th:if="${flash != null}">
      <div th:replace="~{fragments/components :: notice(${flashVariant},
          ${flashVariant == 'success'} ? 'circle-check'
            : (${flashVariant == 'info'} ? 'info' : 'alert-triangle'), ${flash})}"></div>
    </th:block>

    <section class="d-flex flex-wrap gap-4 small text-secondary">
      <span>
        <span class="table__numeric fw-semibold text-body" th:text="${totalSongs}">0</span>
        songs
      </span>
    </section>

    <section th:replace="~{fragments/song-catalog :: filters}"></section>

    <div th:replace="~{fragments/song-catalog :: results}"></div>

  </div>

  <!-- th:block, because th:replace outranks th:if on the same element. -->
  <th:block th:if="${currentUser != null and currentUser.curator}">
    <div th:replace="~{fragments/add-to-playlist :: dialog}"></div>
  </th:block>

</div>
</body>
</html>
