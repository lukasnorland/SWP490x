<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/shell :: shell(~{::content})}">
<!--/* P-04a Shared Workspace — spec 4.6 (FT-07). */-->
<body>
<div th:fragment="content">

  <header class="d-flex flex-column flex-md-row align-items-md-start justify-content-between gap-3 mb-xl">
    <div class="d-flex flex-column gap-1">
      <h1>Shared Workspace</h1>
      <p class="small text-secondary">Published playlists you can view.</p>
    </div>
  </header>

  <div class="d-flex flex-column gap-4">

    <th:block th:if="${flash != null}">
      <div th:replace="~{fragments/components :: notice(${flashVariant},
          ${flashVariant == 'success'} ? 'circle-check'
            : (${flashVariant == 'info'} ? 'info' : 'alert-triangle'), ${flash})}"></div>
    </th:block>

    <!-- Zone B: name search and owner filter -->
    <section class="card">
      <div class="card-body">
        <form class="row g-3 align-items-end" method="get" th:action="@{/workspace}">
          <div class="col-12 col-md-5">
            <label class="form-label" for="filterQuery">Search</label>
            <input class="form-control" type="search" id="filterQuery" name="q"
                   placeholder="Playlist name" th:value="${filterQuery}">
          </div>
          <div class="col-12 col-md-4">
            <label class="form-label" for="filterOwner">Owner</label>
            <select class="form-select" id="filterOwner" name="ownerId">
              <option value="">All</option>
              <option th:each="owner : ${owners}"
                      th:value="${owner.id}"
                      th:text="${owner.name}"
                      th:selected="${filterOwnerId != null and filterOwnerId == owner.id}">Owner</option>
            </select>
          </div>
          <div class="col-12 col-md-3 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">Filter</button>
            <a class="btn btn-ghost" th:href="@{/workspace}" title="Clear filters">Clear</a>
          </div>
        </form>
      </div>
    </section>

    <!-- Zone C: card grid -->
    <section class="row g-4" th:if="${playlists != null and !playlists.isEmpty()}">
      <div class="col-12 col-md-6 col-xl-4" th:each="card : ${playlists}">
        <a class="card card-interactive workspace-card h-100 text-decoration-none"
           th:href="@{|/workspace/${card.id}|}">
          <div class="workspace-mosaic">
            <th:block th:each="cover : ${card.mosaic}">
              <img th:if="${cover != null}" th:src="${cover}" alt="" loading="lazy">
              <span class="workspace-mosaic__empty" th:if="${cover == null}" aria-hidden="true">
                <svg th:replace="~{fragments/icons :: icon('music', 'icon--sm')}"></svg>
              </span>
            </th:block>
          </div>
          <div class="card-body d-flex flex-column gap-2">
            <h2 class="h4 mb-0 text-body" th:text="${card.name}">Name</h2>
            <p class="small text-secondary mb-0">
              <span th:text="${card.ownerName}">Owner</span>
              ·
              <span class="table__numeric" th:text="${card.songCount}">0</span>
              songs
              <span th:if="${card.publishedAt != null}">
                ·
                <span class="table__numeric"
                      th:text="${#temporals.format(card.publishedAt, 'dd MMM yyyy')}">01 Jan 2026</span>
              </span>
            </p>
            <div class="d-flex flex-wrap gap-1" th:if="${!card.tags.isEmpty()}">
              <span th:each="tag : ${card.tags}"
                    class="badge bg-secondary-subtle text-secondary-emphasis"
                    th:text="${tag}">tag</span>
            </div>
          </div>
        </a>
      </div>
    </section>

    <section class="card" th:if="${playlists == null or playlists.isEmpty()}">
      <div th:replace="~{fragments/components :: emptyState('users', 'No published playlists',
              'Publish a playlist from My Playlists and it will show up here.')}"></div>
    </section>

    <!-- Zone D: 12 cards per page -->
    <nav th:if="${playlists != null && playlists.totalPages > 1}"
         class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3"
         aria-label="Pagination">
      <p class="small text-secondary mb-0">
        Page
        <span class="table__numeric" th:text="${playlists.number + 1}">1</span>
        of
        <span class="table__numeric" th:text="${playlists.totalPages}">1</span>
        ·
        <span class="table__numeric" th:text="${playlists.totalElements}">0</span>
        total
      </p>
      <ul class="pagination mb-0">
        <li class="page-item" th:classappend="${playlists.first} ? 'disabled'">
          <a class="page-link"
             th:href="@{/workspace(page=${playlists.number - 1}, q=${filterQuery}, ownerId=${filterOwnerId})}"
             th:attr="aria-disabled=${playlists.first} ? 'true' : null"
             th:tabindex="${playlists.first} ? -1 : null">Previous</a>
        </li>
        <li class="page-item" th:classappend="${playlists.last} ? 'disabled'">
          <a class="page-link"
             th:href="@{/workspace(page=${playlists.number + 1}, q=${filterQuery}, ownerId=${filterOwnerId})}"
             th:attr="aria-disabled=${playlists.last} ? 'true' : null"
             th:tabindex="${playlists.last} ? -1 : null">Next</a>
        </li>
      </ul>
    </nav>

  </div>

</div>
</body>
</html>
