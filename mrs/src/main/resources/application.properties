spring.application.name=mrs
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mrs?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep DB credentials in environment variables or gitignored local.properties.
spring.config.import=optional:file:./local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway manages the schema; JPA validates it.
# Development schema changes currently live in V1; recreate the development database when V1 changes.
# Existing manually initialized databases are baselined at V2.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Schema and seed applied manually before Flyway

# Default inactivity window (BV-07); System Settings applies the live value.
server.servlet.session.timeout=8h
# Disable session persistence to avoid stale principal classes after restarts.
server.servlet.session.persistent=false

# Use SMTP for outbound mail; without a host, log messages for development.
# Keep SMTP credentials and the verified SES sender in local configuration.

mrs.mail.from=no-reply@mrs.local
mrs.mail.from-name=MRS
# Links are read outside any request, so they need an absolute origin.
mrs.mail.base-url=http://localhost:8080
# SES API region; match the configured SMTP endpoint and verified identities.
mrs.mail.ses-region=ap-southeast-1
# CLI profile for SES; blank selects the default credential chain, including the EC2 role.
mrs.mail.aws-profile=mrs-admin

# UC-28: sync staged {prefix}<externalSourceId>.json files into MySQL using ETags.
# Add Song stages media and JSON before queuing this sync (UC-36, UC-37).
mrs.catalog.bucket=mrs-133857166188-assets
mrs.catalog.prefix=song-data/
mrs.catalog.region=ap-southeast-1
# CLI profile for S3; blank selects the default credential chain, including the EC2 role.
mrs.catalog.aws-profile=mrs-admin
# Optional local staging directory; when set, catalog operations use disk instead of S3.
mrs.catalog.local-dir=
# Provider defaults used when no database provider rows exist (UC-31, SC-05).
mrs.catalog.providers=EpidemicSound,NCS,OneOff
# Optional startup import; manual and scheduled sync use the same importer.
mrs.catalog.import-on-start=false
# Scheduled staged-JSON sync; disabled by default for local development and tests.
mrs.catalog.sync.enabled=false
mrs.catalog.sync.interval=15m
# Sample a bounded batch of new/changed covers on the server to avoid browser CORS restrictions.
mrs.catalog.cover-art.enabled=true
mrs.catalog.cover-art.batch-size=2000
mrs.catalog.cover-art.timeout=10s
mrs.catalog.cover-art.max-bytes=8388608

# CDN base URL and object prefixes for company-hosted Add Song media.
mrs.catalog.media.public-base-url=https://d34ixswlpjs53y.cloudfront.net
mrs.catalog.media.audio-prefix=song-data/audio/
mrs.catalog.media.artwork-prefix=song-data/artwork/
mrs.catalog.media.vendor-slugs.EpidemicSound=epidemic
mrs.catalog.media.vendor-slugs.NCS=ncs
mrs.catalog.media.vendor-slugs.OneOff=one-off
mrs.catalog.media.max-audio-bytes=104857600
mrs.catalog.media.max-cover-bytes=5242880
mrs.catalog.media.audio-types=audio/mpeg,audio/wav,audio/flac,audio/mp4,audio/ogg
mrs.catalog.media.cover-types=image/jpeg,image/png,image/webp

# FT-04: use Gemini when a local API key is set, otherwise vocabulary matching.
# Failed interpretations fall back to title/artist keyword search.
# System Settings supplies live model, timeout and query-length values (UC-31).
mrs.llm.provider=gemini
mrs.llm.model=gemini-3.8-flash
mrs.llm.timeout=30s
mrs.llm.min-query-chars=10
mrs.llm.max-query-chars=200

# Multipart budget for up to 10 audio/artwork entries; spill larger parts to disk.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=1100MB
spring.servlet.multipart.file-size-threshold=256KB
# Allow multipart batches and drain rejected uploads so the client can receive the error response.
server.tomcat.max-swallow-size=-1
server.tomcat.max-part-count=200
server.tomcat.max-part-header-size=8KB
server.tomcat.max-http-form-post-size=1100MB

# Request correlation id from CorrelationIdFilter (MDC key correlationId).
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n

# Expose health publicly; other Actuator routes require ADMIN in SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
