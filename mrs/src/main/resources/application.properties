spring.application.name=mrs
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mrs?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Real credentials belong outside version control. Either export DB_USERNAME and
# DB_PASSWORD, or put them in mrs/local.properties, which is gitignored and
# imported below when it exists.
spring.config.import=optional:file:./local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway owns the schema; JPA only validates against it.
# Databases migrated by hand before Flyway was wired in are baselined at V2
# so V1/V2 are not replayed over existing tables and seed rows.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Schema and seed applied manually before Flyway

# FT-01: 8 h inactivity window, then redirect to P-00 with the session-expired notice.
server.servlet.session.timeout=8h

# Email Service (SRS 4.1): the reset link of UC-02 and the credentials message
# of UC-07/BR-15. Leaving spring.mail.host unset keeps the logging transport,
# which writes each message to the application log instead of sending it, so a
# fresh checkout and the test suite run without a mail server.
#
# Real delivery goes through Amazon SES over SMTP, and none of it is committed:
# the SMTP password is a credential, and switching it on also means naming a
# sender that SES has verified in the same region, which is specific to whoever
# set the account up. The whole block therefore lives in mrs/local.properties
# beside the database account — the README describes what it expects.

mrs.mail.from=no-reply@mrs.local
mrs.mail.from-name=MRS
# Links are read outside any request, so they need an absolute origin.
mrs.mail.base-url=http://localhost:8080
# Region for the SES v2 API used by P-06a's "Verify for SES" button. Must match
# the region of spring.mail.host when SMTP is configured.
mrs.mail.ses-region=ap-southeast-1
