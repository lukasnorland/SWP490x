spring.application.name=mrs
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mrs?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Real credentials belong outside version control. Either export DB_USERNAME and
# DB_PASSWORD, or put them in mrs/local.properties, which is gitignored and
# imported below when it exists.
spring.config.import=optional:file:./local.properties

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Flyway owns the schema; JPA only validates against it.
# Databases migrated by hand before Flyway was wired in are baselined at V2
# so V1/V2 are not replayed over existing tables and seed rows.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.baseline-description=Schema and seed applied manually before Flyway

# FT-01: 8 h inactivity window, then redirect to P-00 with the session-expired notice.
server.servlet.session.timeout=8h
# Do not reload Security principals from disk across restarts. MrsUserDetails
# lives in the HTTP session; a class change then yields InvalidClassException
# on the next boot (DevTools restarts make this especially noisy).
server.servlet.session.persistent=false

# Email Service (SRS 4.1): the reset link of UC-02 and the credentials message
# of UC-07/BR-15. Leaving spring.mail.host unset keeps the logging transport,
# which writes each message to the application log instead of sending it, so a
# fresh checkout and the test suite run without a mail server.
#
# Real delivery goes through Amazon SES over SMTP, and none of it is committed:
# the SMTP password is a credential, and switching it on also means naming a
# sender that SES has verified in the same region, which is specific to whoever
# set the account up. The whole block therefore lives in mrs/local.properties
# beside the database account — the README describes what it expects.

mrs.mail.from=no-reply@mrs.local
mrs.mail.from-name=MRS
# Links are read outside any request, so they need an absolute origin.
mrs.mail.base-url=http://localhost:8080
# Region for the SES v2 API used by P-06a's "Verify for SES" button. Must match
# the region of spring.mail.host when SMTP is configured.
mrs.mail.ses-region=ap-southeast-1
# Named profile for CreateEmailIdentity. Defaults to mrs-admin so a developer
# machine never silently uses another AWS account's credentials. On EC2, clear
# this (mrs.mail.aws-profile=) so the instance role is used instead.
mrs.mail.aws-profile=mrs-admin

# Song catalog (UC-28): the offline scripts stage one JSON per song under
# s3://<bucket>/<prefix><externalSourceId>.json, and an import upserts it into
# song / tag / song_tag. Uploading a JSON to that prefix is all it takes to add
# a song; the import compares each object's ETag against song.source_etag, so a
# run only reads objects that are new or whose content changed.
mrs.catalog.bucket=mrs-133857166188-assets
mrs.catalog.prefix=song-data/
mrs.catalog.region=ap-southeast-1
# As with mrs.mail.aws-profile: named profile locally, cleared on EC2 so the
# instance role is used instead.
mrs.catalog.aws-profile=mrs-admin
# Point this at a directory of *.json to import from disk instead of S3.
# Set it (e.g. in local.properties) when `aws login` is unavailable; the tests
# and a laptop with an expired session then never call S3.
mrs.catalog.local-dir=
# Registered providers (SC-05). An object naming anything else is skipped.
mrs.catalog.providers=EpidemicSound,NCS,OneOff
# Import the whole prefix once at startup. Off by default; the ADMIN button on
# P-06c and the scheduled sync below are the normal ways in.
mrs.catalog.import-on-start=false
# Scheduled pickup of objects uploaded straight to S3. Off here so dev machines
# and the test suite never poll; switched on for the deployed instance.
mrs.catalog.sync.enabled=false
mrs.catalog.sync.interval=15m
# Each import reads the covers of songs that have none sampled yet and stores
# the shell's wash colours on the row. The browser cannot do this itself: it
# would need a canvas, and a canvas needs CORS headers that several vendor CDNs
# do not send. Bounded per run, so a large catalog fills in over a few imports.
mrs.catalog.cover-art.enabled=true
mrs.catalog.cover-art.batch-size=2000
mrs.catalog.cover-art.timeout=10s
mrs.catalog.cover-art.max-bytes=8388608

# Company-hosted audio and cover art uploaded from P-06c. The JSON still lands
# at {prefix}{externalSourceId}.json; these prefixes are the binaries it points
# at, served through CloudFront.
mrs.catalog.media.public-base-url=https://d34ixswlpjs53y.cloudfront.net
mrs.catalog.media.audio-prefix=song-data/audio/
mrs.catalog.media.artwork-prefix=song-data/artwork/
mrs.catalog.media.vendor-slugs.EpidemicSound=epidemic
mrs.catalog.media.vendor-slugs.NCS=ncs
mrs.catalog.media.vendor-slugs.OneOff=one-off
mrs.catalog.media.max-audio-bytes=52428800
mrs.catalog.media.max-cover-bytes=5242880
mrs.catalog.media.audio-types=audio/mpeg,audio/wav,audio/flac,audio/mp4,audio/ogg
mrs.catalog.media.cover-types=image/jpeg,image/png,image/webp

# Multipart caps for P-06c. JSON upload still enforces 1 MB in
# CatalogUploadService; the servlet limits have to clear the audio path
# (10 × 50 MB audio + 10 × 5 MB covers, with headroom). Parts above the
# threshold spill to disk so a batch cannot fill the t3.small heap.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=600MB
spring.servlet.multipart.file-size-threshold=256KB
